const pct = (n, axis) => `${n / (axis === 'x' ? 1000 : 560) * 100}%`;

function label(text,x,y,cls='') {

function knob(id,x,y,name,initial=.5,size='') {

}
function setKnob(id,value,emit) { const item=knobs.get(id); if(!item)return; item.value=Math.max(0,Math.min(1,value)); item.el.style.setProperty('--angle',`${-135+270*item.value}deg`); const shown=id==='bpm'?Math.round(40+item.value*200):Math.round(item.value*127); item.el.setAttribute('aria-valuenow',shown); if(emit){send({type:'knob',id,value:item.value});notice(item.name.toUpperCase(),id==='bpm'?`${shown} BPM`:String(shown).padStart(3,'0'));} }

function valueKnob(x,y) {
  const el=document.createElement('button');el.type='button';el.className='element knob small';el.title='Value: trascina o usa la rotella';el.setAttribute('aria-label','Value');
  el.style.setProperty('--angle','0deg');

  function turn(delta){if(!delta)return;send({type:'value',delta});angle+=delta*18;el.style.setProperty('--angle',`${angle}deg`);}
  el.addEventListener('pointerdown',e=>{e.preventDefault();pointer=e.pointerId;lastY=e.clientY;acc=0;el.setPointerCapture(pointer);});
  el.addEventListener('pointermove',e=>{if(e.pointerId!==pointer)return;acc+=(lastY-e.clientY)/12;lastY=e.clientY;const n=Math.trunc(acc);acc-=n;turn(n);});

function pad(index,x,y) {
  const el=document.createElement('button'); el.type='button'; el.className='element pad'; el.setAttribute('aria-label',`Pad ${index+1}`); el.title=`Pad ${index+1}`; position(el,x,y); panel.append(el); pads.push(el);

  el.addEventListener('pointerup',release);el.addEventListener('pointercancel',release);
}

label('electribe sampler',742,31,'brand');label('KORG',919,30,'korg');

function patternSetting(id,title,options){

  const select=document.createElement('select'); select.setAttribute('aria-label',title);

}

function touchEvent(e,down){ const r=touch.getBoundingClientRect();const x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));const y=Math.max(0,Math.min(1,1-(e.clientY-r.top)/r.height));dot.style.left=`${x*100}%`;dot.style.top=`${(1-y)*100}%`;dot.classList.toggle('on',down);send({type:'touch',x,y,down}); if(down) notice(`X ${x.toFixed(2)}  Y ${y.toFixed(2)}`,state.mode.replaceAll('_',' ').toUpperCase()); }

const keys='12345678qwertyui';const held=new Set();

  for(const [id,value] of Object.entries(data.values||{}))if(knobs.has(id)&&!draggingKnobs.has(id))setKnob(id,value,false);
  for(const [id,el] of buttons){const active=id==='play'?data.playing:id==='rec'?data.recording:id==='power'?data.powered:id==='fx'?data.fx_kind==='distortion':id==='shift_mode'?data.pad_mode==='part_select':id==='motion'?data.motion_enabled:id==='shift'?data.shift:id==='enter'?data.menu_open:id==='pattern'?data.pattern_select:id==='mfx_hold'?data.hold:id==='mfx_send'?data.mfx_send:id==='amp_eg'?data.amp_eg:id==='ifx_on'?data.ifx_on:id==='lpf'?data.values?.filter_type<.25:id==='hpf'?data.values?.filter_type>=.25&&data.values?.filter_type<.75:id==='bpf'?data.values?.filter_type>=.75:id.startsWith('step_group_')?Number(id.slice(-1))===data.step_group:id===data.pad_mode||id===data.mode;el.classList.toggle('active',!!active);el.classList.toggle('green',id==='play'&&!!active);}
  pads.forEach((el,i)=>{el.classList.toggle('step-on',!!((data.sequencer&&data.steps[i])||(data.pad_mode==='pattern_set'&&data.pattern_set_slots?.[i])));el.classList.toggle('current',!!(data.playing&&data.step===(data.step_group-1)*16+i));el.classList.toggle('selected',!!(data.pad_mode==='part_select'&&data.part===i));el.classList.toggle('muted',!!(data.pad_mode==='part_mute'&&data.muted?.[i]));});
  lengthSetting.value=String(data.length);keySetting.value=String(data.key);scaleSetting.value=data.scale;levelSetting.value=(Math.round(data.pattern_level*10)/10).toFixed(1);
  metronomeSetting.value=data.metronome;sampleStartSetting.value=(Math.round((data.values?.sample_start||0)*10)/10).toFixed(1);sampleReverseSetting.value=String(Math.round(data.values?.sample_reverse||0));
  const visibleBpm=data.bpm;
  bpmExtra.value=Math.round((data.values?.bpm||0)*100);swingExtra.value=Math.round((data.values?.swing||0)*100);
  microphone.classList.toggle('active',!!data.input_enabled);
  microphone.setAttribute('aria-pressed',String(!!data.input_enabled));
  microphone.textContent=data.input_enabled?'🎙 Disattiva microfono':'🎙 Attiva microfono';
  status.classList.toggle('error',!!(data.audio_error||data.input_error));status.textContent=data.audio_error||data.input_error||`Connesso · Pattern ${data.pattern_index} · ${visibleBpm} BPM · Parte ${data.part+1} · ${data.pad_mode.replaceAll('_',' ')} · Microfono ${data.input_enabled?'attivo':'spento'}`;
}
async function assignSample(){
  if(location.protocol==='file:'){status.textContent='Avvia il server per assegnare i WAV';return;}
  try{
    const res=await fetch('/api/samples'); const files=await res.json();
    if(!files.length){wavInput.click();return;}
    const filename=prompt(`Pad ${lastPad+1}: scrivi un nome WAV oppure IMPORTA per scegliere un file.\nDisponibili:\n${files.join('\n')}`,files[0]);
    if(!filename)return;
    if(filename.trim().toUpperCase()==='IMPORTA'){wavInput.click();return;}
    const assigned=await fetch('/api/assign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({index:lastPad,filename})});
    const result=await assigned.json();
    if(!assigned.ok)throw Error(result.detail||'Assegnazione fallita');
    render(result);
  }catch(error){status.textContent=String(error);status.classList.add('error');}
}
wavInput.addEventListener('change',async()=>{
  const file=wavInput.files?.[0]; if(!file)return;
  const targetPad=lastPad; wavInput.value='';
  try{
    const response=await fetch(`/api/upload/${encodeURIComponent(file.name)}?index=${targetPad}`,{method:'POST',headers:{'Content-Type':'audio/wav'},body:file});
    const result=await response.json();
    if(!response.ok)throw Error(result.detail||'Caricamento WAV fallito');
    render(result);
  }catch(error){status.textContent=String(error);status.classList.add('error');}
});
function connect(){socket=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);socket.onmessage=e=>{try{render(JSON.parse(e.data));}catch(err){console.error(err);}};socket.onclose=()=>{status.textContent='Connessione persa. Riconnessione…';status.classList.add('error');setTimeout(connect,1500);};socket.onerror=()=>{status.textContent='Avvia il backend: uvicorn main:app';status.classList.add('error');};}
function playRemoteBlock(bytes){
  if(!audioContext || audioContext.state!=='running')return;
  const samples=new DataView(bytes), frames=Math.floor(samples.byteLength/4);
  if(!frames)return;
  const buffer=audioContext.createBuffer(2,frames,audioRate);
  const left=buffer.getChannelData(0), right=buffer.getChannelData(1);
  for(let i=0;i<frames;i++){left[i]=samples.getInt16(i*4,true)/32768;right[i]=samples.getInt16(i*4+2,true)/32768;}
  const now=audioContext.currentTime;
  if(audioStartTime<now-.03)audioStartTime=now+.11;
  if(audioStartTime>now+.45)return; // Evita che il ritardo aumenti se la rete rallenta.
  const source=audioContext.createBufferSource(); source.buffer=buffer; source.connect(audioContext.destination);
  source.start(audioStartTime); audioStartTime+=buffer.duration;
  source.onended=()=>source.disconnect();
}
async function stopLocalAudio(){
  audioWanted=false;
  if(audioSocket){audioSocket.close();audioSocket=null;}
  if(audioContext){const old=audioContext;audioContext=null;await old.close();}
  audioStartTime=0;
  listenHere.classList.remove('active');
  listenHere.textContent='🔊 Ascolta su questo dispositivo';
  audioHint.textContent='Ascolto sul dispositivo disattivato.';
}
listenHere.addEventListener('click',async()=>{
  if(audioWanted){
    if(audioContext?.state!=='running'){await audioContext.resume();listenHere.textContent='■ Ferma audio qui';audioHint.textContent='Audio riattivato.';return;}
    await stopLocalAudio();return;
  }
  if(location.protocol==='file:'){audioHint.textContent='Apri la pagina tramite il server Python per ascoltare.';return;}
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextClass){audioHint.textContent='Questo browser non supporta Web Audio.';return;}
  try{
    audioContext=new AudioContextClass({latencyHint:'interactive'});
    const unlock=audioContext.createBufferSource();unlock.buffer=audioContext.createBuffer(1,1,audioContext.sampleRate);unlock.connect(audioContext.destination);unlock.start();
    await audioContext.resume();
    audioWanted=true;audioLastError='';listenHere.classList.add('active');listenHere.textContent='■ Ferma audio qui';audioHint.textContent='Connessione audio in corso…';
    audioSocket=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/audio`);
    audioSocket.binaryType='arraybuffer';
    audioSocket.onmessage=e=>{
      if(typeof e.data==='string'){
        const message=JSON.parse(e.data);
        if(message.type==='audio_format'){audioRate=message.rate;audioHint.textContent='Audio ricevuto su questo dispositivo. Il Mac può suonare insieme.';}
        else if(message.type==='audio_error'){audioLastError=message.message;audioHint.textContent=message.message;}
      }else playRemoteBlock(e.data);
    };
    audioSocket.onclose=()=>{if(audioWanted){stopLocalAudio().then(()=>{audioHint.textContent=audioLastError||'Audio scollegato: tocca il pulsante per riprovare.';});}};
  }catch(error){await stopLocalAudio();audioHint.textContent=`Impossibile avviare l’audio: ${error}`;}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&audioWanted&&audioContext?.state!=='running'){listenHere.textContent='▶ Riprendi audio qui';audioHint.textContent='Tocca per riattivare l’audio.';}});
// Aprendo il file direttamente si vede il pannello; per audio e stato serve il server.
if(location.protocol==='file:'){status.textContent='Interfaccia pronta · Per audio e sequencer avvia: uvicorn main:app';status.classList.add('error');}else connect();
</script>
