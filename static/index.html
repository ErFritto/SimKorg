<script>
/* La foto è 447×447: il pannello occupa circa x=30..420, y=118..335.

const panel = document.querySelector('#panel');

let socket, touchPointer = null, lastPad = 0;
let audioSocket, audioContext, audioStartTime = 0, audioRate = 44100, audioWanted = false, audioLastError = '';
const pct = (n, axis) => `${n / (axis === 'x' ? 1000 : 560) * 100}%`;
function position(el,x,y,w,h) {
  el.style.left=pct(x,'x'); el.style.top=pct(y,'y');
  if(w) el.style.width=pct(w,'x'); if(h) el.style.height=pct(h,'y');

function label(text,x,y,cls='') {
  const el=document.createElement('span'); el.className='label '+cls;

}
function rule(x,y,w) { const el=document.createElement('div'); el.className='rule'; el.style.left=pct(x,'x'); el.style.top=pct(y,'y'); el.style.width=pct(w,'x'); panel.append(el); }

function notice(a,b) { display.innerHTML=''; display.append(document.createTextNode(a)); const small=document.createElement('small'); small.textContent=b; display.append(small); }
function knob(id,x,y,name,initial=.5,size='') {

  el.setAttribute('aria-label',name); el.title=name; if(id==='bpm'){el.setAttribute('aria-valuemin','40');el.setAttribute('aria-valuemax','240');} position(el,x,y); panel.append(el);

  let startY,startV,pointer;

  el.addEventListener('pointercancel',()=>{pointer=null; draggingKnobs.delete(id);});

  el.addEventListener('dblclick',()=>setKnob(id,initial,true));
  el.addEventListener('keydown',e=>{ if(e.key==='ArrowUp'||e.key==='ArrowRight'||e.key==='ArrowDown'||e.key==='ArrowLeft') { e.preventDefault(); setKnob(id,knobs.get(id).value+(['ArrowUp','ArrowRight'].includes(e.key)?.02:-.02),true); } });
}
function setKnob(id,value,emit) { const item=knobs.get(id); if(!item)return; item.value=Math.max(0,Math.min(1,value)); item.el.style.setProperty('--angle',`${-135+270*item.value}deg`); const shown=id==='bpm'?Math.round(40+item.value*200):Math.round(item.value*127); item.el.setAttribute('aria-valuenow',shown); if(emit){send({type:'knob',id,value:item.value});notice(item.name.toUpperCase(),id==='bpm'?`${shown} BPM`:String(shown).padStart(3,'0'));} }
function button(id,x,y,w,h,text='',cls='tiny') {
  const el=document.createElement('button'); el.type='button'; el.className='element btn '+cls;
  el.setAttribute('aria-label',id.replaceAll('_',' ')); el.title=id.replaceAll('_',' '); el.textContent=text;
  position(el,x,y,w,h); panel.append(el); buttons.set(id,el);
  el.addEventListener('click',()=>{el.classList.add('pressed');setTimeout(()=>el.classList.remove('pressed'),130);if(id==='sample_edit') { assignSample(); return; } send({type:'button',id});});
  return el;
}
function pad(index,x,y) {
  const el=document.createElement('button'); el.type='button'; el.className='element pad'; el.setAttribute('aria-label',`Pad ${index+1}`); el.title=`Pad ${index+1}`; position(el,x,y); panel.append(el); pads.push(el);
  el.addEventListener('pointerdown',e=>{e.preventDefault();const r=el.getBoundingClientRect();const dx=(e.clientX-r.left-r.width/2)/(r.width/2),dy=(e.clientY-r.top-r.height/2)/(r.height/2);const velocity=Math.max(.2,1-.55*Math.min(1,Math.hypot(dx,dy)));lastPad=index;send({type:'pad',index,velocity,down:true});el.classList.add('hit');});

  el.addEventListener('pointerup',release);el.addEventListener('pointercancel',release);
}
// Marchio e comandi nella fascia superiore.
label('electribe sampler',742,31,'brand');label('KORG',919,30,'korg');
label('POWER',76,29);label('VOLUME',146,29);label('INPUT LEVEL',213,29);
button('power',76,62,30,30,'','round');knob('volume',146,62,'Volume',.7,'small');knob('input_level',213,62,'Input Level',.5,'small');
// Trasporto a sinistra, in due file come nel riferimento.
[['rec',76],['play',126],['stop',176],['tap',226]].forEach(([id,x])=>{button(id,x,247,40,33,id==='play'?'▶':id==='rec'?'●':id==='stop'?'■':'TAP','oval');label(id==='play'?'PLAY/PAUSE':id.toUpperCase(),x,275);});
[['shift',76],['exit',126],['write',176],['enter',226]].forEach(([id,x])=>button(id,x,296,39,17,id.toUpperCase()));
// Gruppi di manopole: due livelli visivi e i tasti delle funzioni sottostanti.
[['Sample',435],['Filter',558],['Modulation',681],['Amp/EG',790],['Insert Fx',914]].forEach(([name,x])=>label(name,x,84,'group'));
rule(389,96,90);rule(513,96,92);rule(632,96,99);rule(749,96,84);rule(870,96,86);
knob('sample',331,123,'Sample',.5,'big');knob('pitch',435,123,'Pitch',.5);
knob('cutoff',558,123,'Cutoff',.75);knob('lfo_rate',681,123,'Rate',.3);
knob('level',761,123,'Level',.8,'small');knob('attack',839,123,'Attack',0,'small');knob('fx_depth',917,123,'FX Depth',.2);
knob('resonance',435,187,'Resonance',.2,'small');knob('filter_type',515,187,'Filter Type',0,'small');
knob('lfo_depth',598,187,'LFO Depth',0,'small');knob('lfo_shape',680,187,'LFO Shape',0,'small');
knob('pan',760,187,'Pan',.5,'small');knob('decay',839,187,'Decay',.45,'small');knob('fx_time',917,187,'FX Time',.35,'small');
knob('bpm',434,248,'BPM',.4,'small');knob('swing',681,248,'Swing',0,'small');
button('part_prev',331,186,47,19,'◀ PART');button('part_next',331,218,47,19,'PART ▶');
[['pattern',331],['sample_edit',381],['filter',515],['mod',598],['amp',760],['fx',839],['motion',917]].forEach(([id,x])=>button(id,x,247,42,19,id.toUpperCase()));
// File di pulsanti stretti sopra i pad. Alcuni nomi sono ricostruiti dalla serie electribe.
[['gate_arp',330],['touch_scale',380],['master_fx',430],['mfx_hold',480],['sequencer',530],['trigger',580],['part_mute',630],['part_erase',680],['part_copy',730],['part_paste',780],['shift_mode',830],['menu',880],['cursor',930]].forEach(([id,x])=>button(id,x,296,44,17,id==='gate_arp'?'GATE':id==='touch_scale'?'SCALE':id==='master_fx'?'MFX':id==='sequencer'?'SEQ':id==='mfx_hold'?'HOLD':id.replace('part_','').toUpperCase()));
label('GATE ARP',330,320);label('TOUCH SCALE',382,320);label('MASTER FX',433,320);label('MFX HOLD',480,320);
// Tre pulsanti verticali sul margine destro, separati dalla fila orizzontale.
[['cursor_up',882,'▲'],['cursor_down',927,'▼'],['value',972,'+']].forEach(([id,x,text])=>button(id,x,336,18,28,text,'oval'));
// Matrice 2×8, corrispondente ai sedici pad della foto.
for(let i=0;i<16;i++) pad(i,320+(i%8)*86,397+Math.floor(i/8)*86);
function touchEvent(e,down){ const r=touch.getBoundingClientRect();const x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));const y=Math.max(0,Math.min(1,1-(e.clientY-r.top)/r.height));dot.style.left=`${x*100}%`;dot.style.top=`${(1-y)*100}%`;dot.classList.toggle('on',down);send({type:'touch',x,y,down}); if(down) notice(`X ${x.toFixed(2)}  Y ${y.toFixed(2)}`,state.mode.replaceAll('_',' ').toUpperCase()); }
touch.addEventListener('pointerdown',e=>{e.preventDefault();if(touchPointer!==null)return;touchPointer=e.pointerId;touch.setPointerCapture(e.pointerId);touchEvent(e,true);});
touch.addEventListener('pointermove',e=>{if(e.pointerId===touchPointer)touchEvent(e,true);});
function releaseTouch(e){if(e.pointerId!==touchPointer)return;touchEvent(e,false);touchPointer=null;}
touch.addEventListener('pointerup',releaseTouch);touch.addEventListener('pointercancel',releaseTouch);
touch.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();send({type:'touch',x:.5,y:.7,down:true});setTimeout(()=>send({type:'touch',x:.5,y:.7,down:false}),200);}});
const keys='12345678qwertyui';const held=new Set();
document.addEventListener('keydown',e=>{if(e.repeat||e.target.tagName==='INPUT')return;const i=keys.indexOf(e.key.toLowerCase());if(i<0)return;e.preventDefault();held.add(i);lastPad=i;send({type:'pad',index:i,velocity:.85,down:true});pads[i].classList.add('hit');});
document.addEventListener('keyup',e=>{const i=keys.indexOf(e.key.toLowerCase());if(i<0||!held.has(i))return;held.delete(i);send({type:'pad',index:i,down:false});pads[i].classList.remove('hit');});
function render(data){ if(data.type==='error'){status.textContent=data.message;status.classList.add('error');return;} if(data.type!=='state')return;
  Object.assign(state,data); if(!draggingKnobs.has('bpm'))notice(data.display[0]||'',data.display[1]||'');
  for(const [id,value] of Object.entries(data.values||{}))if(knobs.has(id)&&!draggingKnobs.has(id))setKnob(id,value,false);
  for(const [id,el] of buttons){const active=id==='play'?data.playing:id==='rec'?data.recording:id==='power'?data.powered:id==='fx'?data.fx_kind==='distortion':id==='sequencer'?data.sequencer:id==='shift_mode'?data.pad_mode==='part_select':id==='part_mute'?data.muted?.[data.part]:id==='motion'?data.motion_enabled:id==='shift'?data.shift:id==='menu'?data.menu_open:id==='pattern'?data.pattern_select:id==='mfx_hold'?data.hold:id===data.mode;el.classList.toggle('active',!!active);el.classList.toggle('green',id==='play'&&!!active);}
  pads.forEach((el,i)=>{el.classList.toggle('step-on',!!(data.sequencer&&data.steps[i]));el.classList.toggle('current',!!(data.playing&&data.step===i));el.classList.toggle('selected',!!(data.pad_mode==='part_select'&&data.part===i));});
  const visibleBpm=draggingKnobs.has('bpm')?Math.round(40+knobs.get('bpm').value*200):data.bpm;
  status.classList.toggle('error',!!data.audio_error);status.textContent=data.audio_error||`Connesso · Pattern ${data.pattern_index} · ${visibleBpm} BPM · Parte ${data.part+1} · ${data.pad_mode==='part_select'?'Selezione parti':data.sequencer?'Sequencer':'Trigger'} · ${data.input_enabled?'Ingresso attivo':'Ingresso non disponibile'}`;
}
async function assignSample(){
  if(location.protocol==='file:'){status.textContent='Avvia il server per assegnare i WAV';return;}
  try{
    const res=await fetch('/api/samples'); const files=await res.json();
    if(!files.length){wavInput.click();return;}
    const filename=prompt(`Pad ${lastPad+1}: scrivi un nome WAV oppure IMPORTA per scegliere un file.\nDisponibili:\n${files.join('\n')}`,files[0]);
    if(!filename)return;
    if(filename.trim().toUpperCase()==='IMPORTA'){wavInput.click();return;}
    const assigned=await fetch('/api/assign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({index:lastPad,filename})});
    const result=await assigned.json();
    if(!assigned.ok)throw Error(result.detail||'Assegnazione fallita');
    render(result);
  }catch(error){status.textContent=String(error);status.classList.add('error');}
}
wavInput.addEventListener('change',async()=>{
  const file=wavInput.files?.[0]; if(!file)return;
  const targetPad=lastPad; wavInput.value='';
  try{
    const response=await fetch(`/api/upload/${encodeURIComponent(file.name)}?index=${targetPad}`,{method:'POST',headers:{'Content-Type':'audio/wav'},body:file});
    const result=await response.json();
    if(!response.ok)throw Error(result.detail||'Caricamento WAV fallito');
    render(result);
  }catch(error){status.textContent=String(error);status.classList.add('error');}
});
function connect(){socket=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);socket.onmessage=e=>{try{render(JSON.parse(e.data));}catch(err){console.error(err);}};socket.onclose=()=>{status.textContent='Connessione persa. Riconnessione…';status.classList.add('error');setTimeout(connect,1500);};socket.onerror=()=>{status.textContent='Avvia il backend: uvicorn main:app';status.classList.add('error');};}
function playRemoteBlock(bytes){
  if(!audioContext || audioContext.state!=='running')return;
  const samples=new DataView(bytes), frames=Math.floor(samples.byteLength/4);
  if(!frames)return;
  const buffer=audioContext.createBuffer(2,frames,audioRate);
  const left=buffer.getChannelData(0), right=buffer.getChannelData(1);
  for(let i=0;i<frames;i++){left[i]=samples.getInt16(i*4,true)/32768;right[i]=samples.getInt16(i*4+2,true)/32768;}
  const now=audioContext.currentTime;
  if(audioStartTime<now-.03)audioStartTime=now+.11;
  if(audioStartTime>now+.45)return; // Evita che il ritardo aumenti se la rete rallenta.
  const source=audioContext.createBufferSource(); source.buffer=buffer; source.connect(audioContext.destination);
  source.start(audioStartTime); audioStartTime+=buffer.duration;
  source.onended=()=>source.disconnect();
}
async function stopLocalAudio(){
  audioWanted=false;
  if(audioSocket){audioSocket.close();audioSocket=null;}
  if(audioContext){const old=audioContext;audioContext=null;await old.close();}
  audioStartTime=0;
  listenHere.classList.remove('active');
  listenHere.textContent='🔊 Ascolta su questo dispositivo';
  audioHint.textContent='Ascolto sul dispositivo disattivato.';
}
listenHere.addEventListener('click',async()=>{
  if(audioWanted){
    if(audioContext?.state!=='running'){await audioContext.resume();listenHere.textContent='■ Ferma audio qui';audioHint.textContent='Audio riattivato.';return;}
    await stopLocalAudio();return;
  }
  if(location.protocol==='file:'){audioHint.textContent='Apri la pagina tramite il server Python per ascoltare.';return;}
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextClass){audioHint.textContent='Questo browser non supporta Web Audio.';return;}
  try{
    audioContext=new AudioContextClass({latencyHint:'interactive'});
    const unlock=audioContext.createBufferSource();unlock.buffer=audioContext.createBuffer(1,1,audioContext.sampleRate);unlock.connect(audioContext.destination);unlock.start();
    await audioContext.resume();
    audioWanted=true;audioLastError='';listenHere.classList.add('active');listenHere.textContent='■ Ferma audio qui';audioHint.textContent='Connessione audio in corso…';
    audioSocket=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/audio`);
    audioSocket.binaryType='arraybuffer';
    audioSocket.onmessage=e=>{
      if(typeof e.data==='string'){
        const message=JSON.parse(e.data);
        if(message.type==='audio_format'){audioRate=message.rate;audioHint.textContent='Audio ricevuto su questo dispositivo. Il Mac può suonare insieme.';}
        else if(message.type==='audio_error'){audioLastError=message.message;audioHint.textContent=message.message;}
      }else playRemoteBlock(e.data);
    };
    audioSocket.onclose=()=>{if(audioWanted){stopLocalAudio().then(()=>{audioHint.textContent=audioLastError||'Audio scollegato: tocca il pulsante per riprovare.';});}};
  }catch(error){await stopLocalAudio();audioHint.textContent=`Impossibile avviare l’audio: ${error}`;}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&audioWanted&&audioContext?.state!=='running'){listenHere.textContent='▶ Riprendi audio qui';audioHint.textContent='Tocca per riattivare l’audio.';}});
// Aprendo il file direttamente si vede il pannello; per audio e stato serve il server.
if(location.protocol==='file:'){status.textContent='Interfaccia pronta · Per audio e sequencer avvia: uvicorn main:app';status.classList.add('error');}else connect();
</script>
</body>
</html>
